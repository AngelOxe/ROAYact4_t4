spring.application.name=roayact4

# Puerto de la API
server.port=${SERVER_PORT:8087}

# Conexion con MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/roayact4_t4}
spring.datasource.username=${DB_USER:roay_act4}
spring.datasource.password=${DB_PASSWORD}

# Persistencia con JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Autenticacion JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=roayact4
app.jwt.expiration-seconds=3600